<script>

const girls=[

{
 name:"さくら",
 flag:"🇯🇵",
 face:"🌸"
},

{

 flag:"🇫🇷",
 face:"🎀"
},

},

{

},

},

},

{

}

];


const palettes=[

[
"#e9d6dc",
"#d8e5ee",
"#e4dfc2",
"#d9e8da",
"#e5d8ec",
"#efddcf"
],

[
"#e6d8eb",
"#d8e8dc",
"#eed7d7",
"#d8e4ef",
"#eee2bd",
"#ead9cf"
],

[
"#d8e5ee",
"#eed7df",
"#d8e7dc",
"#e4d9eb",
"#eee1bb",
"#eddbcf"
]

];


let stage=1;

let size=4;

let hearts=3;

let memo=new Set();

let wrong=new Set();

let solved=new Set();

let regions=[];

let targets=[];

let tapTimer=null;

let downId=null;

let dragging=false;

let dragValue=true;

let lastTapTime=0;

let lastTapId=-1;


/* --------------------------------
   ステージサイズ
-------------------------------- */

function stageSize(s){

if(s<=2) return 4;

if(s<=20) return 5;

if(s<=50) return 6;

if(s<=100) return 7;

if(s<=200) return 8;

return 10;

}


/* --------------------------------
   正解位置
   各行に1つ
   各列に1つ
   8方向で隣接しない
-------------------------------- */

function targetPermutation(n,s){

const sets={

4:[

[1,3,0,2],

[2,0,3,1]

],

5:[

[0,2,4,1,3],

[1,3,0,2,4],

[2,4,1,3,0],

[3,0,2,4,1]

],

6:[

[0,2,4,1,5,3],

[1,3,5,0,2,4],

[2,4,0,5,1,3],

[3,5,1,4,0,2]

],

7:[

[0,2,4,6,1,3,5],

[1,3,5,0,2,4,6],

[2,4,6,1,3,5,0],

[3,5,0,2,4,6,1]

],

8:[

[0,2,4,6,1,3,5,7],

[1,3,5,7,0,2,4,6],

[2,4,6,0,3,5,7,1],

[3,5,7,1,4,6,0,2]

],

10:[

[0,2,4,6,8,1,3,5,7,9],

[1,3,5,7,9,0,2,4,6,8],

[2,4,6,8,0,3,5,7,9,1],

[3,5,7,9,1,4,6,8,0,2]

]

};

return sets[n][(s-1)%sets[n].length];

}


/* --------------------------------
   8方向隣接チェック
-------------------------------- */

function isAdjacent(a,b,n){

const ar=Math.floor(a/n);

const ac=a%n;

const br=Math.floor(b/n);

const bc=b%n;

return Math.max(
Math.abs(ar-br),
Math.abs(ac-bc)
)<=1;

}


/* --------------------------------
   正解配置を検証
-------------------------------- */

function validTargets(n,p){

for(let r=0;r<n;r++){

for(let rr=r+1;rr<n;rr++){

const a=r*n+p[r];

const b=rr*n+p[rr];

if(isAdjacent(a,b,n)){

return false;

}

}

}

return new Set(p).size===n;

}


/* --------------------------------
   色領域生成

   ★重要
   region 0 は必ず1マスだけ
   しかもそのマスは正解位置

   他の色は正解位置を種にして
   盤面全体を連結領域にする
-------------------------------- */

function makeRegions(n,s){

const p=targetPermutation(n,s);

const g=
Array.from(
{length:n},
()=>Array(n).fill(-1)
);


/*
   正解セルを各色の中心にする
*/

for(let r=0;r<n;r++){

g[r][p[r]]=r;

}


/*
   最初の色だけは
   正解セル1マスに固定する。

   つまり、
   1マス色 = 必ず正解
*/

const fixedCell=p[0];

g[
Math.floor(fixedCell/n)
][
fixedCell%n
]=0;


/*
   残りの色を
   多点スタートのBFSで拡張する。

   これにより、
   各色の領域が必ず連結する。
*/

let changed=true;

while(changed){

changed=false;

for(let r=0;r<n;r++){

for(let c=0;c<n;c++){

if(g[r][c]!==-1) continue;

let best=-1;

const candidates=[];

for(let dr=-1;dr<=1;dr++){

for(let dc=-1;dc<=1;dc++){

if(dr===0 && dc===0) continue;

const rr=r+dr;

const cc=c+dc;

if(
rr>=0 &&
rr<n &&
cc>=0 &&
cc<n &&
g[rr][cc]>0
){

candidates.push(
g[rr][cc]
);

}

}

}

if(candidates.length){

best=candidates[
(r+c+s)%candidates.length
];

g[r][c]=best;

changed=true;

}

}

}

}


/*
   万一未配置セルが残った場合、
   最も近い色へ入れる。
*/

for(let r=0;r<n;r++){

for(let c=0;c<n;c++){

if(g[r][c]!==-1) continue;

let best=1;

let bestDist=999;

for(let rr=0;rr<n;rr++){

for(let cc=0;cc<n;cc++){

if(g[rr][cc]===-1) continue;

if(g[rr][cc]===0) continue;

const d=
Math.abs(r-rr)+
Math.abs(c-cc);

if(d<bestDist){

bestDist=d;

best=g[rr][cc];

}

}

}

g[r][c]=best;

}

}


/*
   最後に、
   各正解セルの色を必ず自分の色にする。

   これにより
   「1色に1つの🎁」
   が保証される。
*/

for(let r=0;r<n;r++){

g[r][p[r]]=r;

}


/*
   1番目の色は
   正解セル以外には絶対に使わない。

   これで
   「1マスだけの色」
   を保証する。
*/

for(let r=0;r<n;r++){

for(let c=0;c<n;c++){

if(
r*n+c!==fixedCell &&
g[r][c]===0
){

g[r][c]=1;

}

}

}


/*
   正解位置以外に
   その正解色が入っていないか確認。
*/

for(let r=0;r<n;r++){

for(let c=0;c<n;c++){

if(r*n+c===p[r]) continue;

if(g[r][c]===r){

g[r][c]=1;

}

}

}


/*
   すべての正解セルに
   それぞれ異なる色を再設定。
*/

for(let r=0;r<n;r++){

g[r][p[r]]=r;

}


/*
   region 0 は最終的に
   必ず1マスだけ。
*/

for(let r=0;r<n;r++){

for(let c=0;c<n;c++){

if(r*n+c!==fixedCell && g[r][c]===0){

g[r][c]=1;

}

}

}

return g;

}


/* --------------------------------
   ステージ初期化
-------------------------------- */

function initStage(){

size=stageSize(stage);

const p=targetPermutation(size,stage);

if(!validTargets(size,p)){

console.error(
"Target configuration error",
stage,
p
);

}

regions=makeRegions(size,stage);


/*
   各行の正解セル
*/

targets=p.map(
(c,r)=>r*size+c
);

}


/* --------------------------------
   色
-------------------------------- */

function colorOf(id){

const r=
Math.floor(id/size);

const c=
id%size;

const region=
regions[r][c];

return palettes[
(stage-1)%palettes.length
][
region%6
];

}


/* --------------------------------
   描画
-------------------------------- */

function render(){

const girl=
girls[(stage-1)%girls.length];

document.getElementById(
"stageLabel"
).textContent=
"STAGE "+stage;

document.getElementById(
"sizeLabel"
).textContent=
size+" × "+size;

document.getElementById(
"girlName"
).textContent=
"　"+girl.name+" "+girl.flag;

document.getElementById(
"avatar"
).textContent=
girl.face;

document.getElementById(
"hearts"
).textContent=
"♥".repeat(hearts)+
"♡".repeat(3-hearts);


/*
   ステージ1だけ説明
*/

document.getElementById(
"rulesPanel"
).style.display=
stage===1?"block":"none";

document.getElementById(
"howto"
).style.display=
stage===1?"grid":"none";


const board=
document.getElementById("board");

board.style.gridTemplateColumns=
`repeat(${size},1fr)`;

board.innerHTML="";


for(
let id=0;
id<size*size;
id++
){

const cell=
document.createElement("div");

cell.className="cell";

cell.dataset.id=id;

cell.style.background=
colorOf(id);


/*
   プレイヤーの白✕
*/

if(memo.has(id)){

cell.innerHTML=
'<span class="memo">✕</span>';

}


/*
   間違いの赤✕
*/

if(wrong.has(id)){

cell.innerHTML=
'<span class="wrong">✕</span>';

}


/*
   正解した🎁
*/

if(solved.has(id)){

cell.innerHTML=
'<span class="target">🎁</span>';

}


cell.addEventListener(
"pointerdown",
e=>pointerDown(e,id)
);

cell.addEventListener(
"pointerenter",
e=>pointerEnter(e,id)
);

cell.addEventListener(
"pointerup",
e=>pointerUp(e,id)
);

board.appendChild(cell);

}

}


/* --------------------------------
   ハプティクス
-------------------------------- */

function haptic(kind="tap"){

try{

if(!navigator.vibrate)return;

if(kind==="wrong"){

navigator.vibrate([18,25,35]);

}else if(kind==="clear"){

navigator.vibrate([18,25,45]);

}else if(kind==="check"){

navigator.vibrate(12);

}else{

navigator.vibrate(8);

}

}catch(e){}

}


/* --------------------------------
   サウンド
-------------------------------- */

let audioCtx=null;

let musicOn=true;

let musicTimer=null;

let musicStep=0;


const melody=[

523.25,
659.25,
783.99,
659.25,

587.33,
698.46,
880,
698.46,

523.25,
659.25,
783.99,
987.77,

783.99,
659.25,
587.33,
523.25

];


function ensureAudio(){

if(!musicOn)return;

try{

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(
audioCtx.state!=="running"
){

audioCtx.resume();

}

}catch(e){

audioCtx=null;

}

}


function tone(
freq,
duration=.11,
volume=.028,
type="sine",
when=null
){

if(!audioCtx||!musicOn)return;

const t=
when ??
audioCtx.currentTime;

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.type=type;

osc.frequency.setValueAtTime(
freq,
t
);

gain.gain.setValueAtTime(
.0001,
t
);

gain.gain.exponentialRampToValueAtTime(
volume,
t+.012
);

gain.gain.exponentialRampToValueAtTime(
.0001,
t+duration
);

osc.connect(gain);

gain.connect(
audioCtx.destination
);

osc.start(t);

osc.stop(
t+duration+.02
);

}


function startMusic(){

ensureAudio();

if(
!audioCtx||
!musicOn||
musicTimer
)return;

const play=()=>{

if(!audioCtx||!musicOn)return;

const now=
audioCtx.currentTime+.02;

tone(
melody[
musicStep%
melody.length
],
.16,
.018,
"triangle",
now
);

musicStep++;

};

play();

musicTimer=
setInterval(
play,
360
);

}


function stopMusic(){

if(musicTimer){

clearInterval(musicTimer);

musicTimer=null;

}

}


function tapSound(){

ensureAudio();

tone(
740,
.055,
.025,
"sine"
);

}


function checkSound(ok){

ensureAudio();

if(ok){

tone(
659,
.09,
.035,
"triangle"
);

setTimeout(
()=>tone(
988,
.13,
.04,
"triangle"
),
75
);

}else{

tone(
180,
.12,
.035,
"sawtooth"
);

}

}


function clearSound(){

ensureAudio();

if(!audioCtx)return;

const t=
audioCtx.currentTime+.02;

[
523.25,
659.25,
783.99,
1046.5,
1318.51
].forEach(
(f,i)=>
tone(
f,
.18,
.045,
"triangle",
t+i*.09
)
);

setTimeout(
()=>tone(
1567.98,
.35,
.035,
"sine"
),
450
);

}


/* --------------------------------
   サウンドボタン
-------------------------------- */

document
.getElementById("soundBtn")
.addEventListener(
"click",
()=>{

musicOn=!musicOn;

const button=
document.getElementById(
"soundBtn"
);

button.textContent=
musicOn?"🔊":"🔇";

if(musicOn){

ensureAudio();

startMusic();

}else{

stopMusic();

}

}
);


/* --------------------------------
   白✕
-------------------------------- */

function toggleMemo(
id,
on=null
){

if(
solved.has(id)||
wrong.has(id)
)return;

const shouldAdd=
on===null
?
!memo.has(id)
:
on;

if(shouldAdd){

memo.add(id);

}else{

memo.delete(id);

}

render();

}


/* --------------------------------
   タップ・ダブルタップ
-------------------------------- */

function pointerDown(e,id){

e.preventDefault();

ensureAudio();

tapSound();

haptic("tap");

downId=id;

dragging=false;

const now=
Date.now();


/*
   ダブルタップ判定
*/

if(
now-lastTapTime<330 &&
lastTapId===id
){

clearTimeout(tapTimer);

lastTapTime=0;

lastTapId=-1;

check(id);

return;

}


lastTapTime=now;

lastTapId=id;


clearTimeout(tapTimer);

tapTimer=
setTimeout(
()=>{

if(
lastTapTime===now &&
lastTapId===id &&
!dragging
){

toggleMemo(id);

}

},
340
);

}


/* --------------------------------
   ドラッグ
-------------------------------- */

function pointerEnter(e,id){

if(
e.buttons!==1||
downId===null||
id===downId
)return;

if(!dragging){

dragging=true;

clearTimeout(tapTimer);

dragValue=
!memo.has(id);

}

toggleMemo(
id,
dragValue
);

}


function pointerUp(e,id){

downId=null;

dragging=false;

}


/* --------------------------------
   正解判定
-------------------------------- */

function check(id){

if(solved.has(id))return;

const ok=
targets.includes(id);

haptic(
ok?"check":"wrong"
);

checkSound(ok);


if(ok){

solved.add(id);

memo.delete(id);

wrong.delete(id);

render();


/*
   全正解
*/

if(
solved.size===
targets.length
){

setTimeout(
clearStage,
300
);

}

}else{

wrong.add(id);

memo.delete(id);

hearts--;

render();


if(hearts<=0){

setTimeout(
()=>{

stopMusic();

alert(
"ハートがなくなりました。\nステージをやり直します。"
);

resetStage();

},
250
);

}

}

}


/* --------------------------------
   ステージリセット
-------------------------------- */

function resetStage(){

hearts=3;

memo.clear();

wrong.clear();

solved.clear();

initStage();

render();

startMusic();

}


/* --------------------------------
   ステージクリア
-------------------------------- */

function clearStage(){

stopMusic();

clearSound();

haptic("clear");

const girl=
girls[(stage-1)%girls.length];

document.getElementById(
"clearGirl"
).textContent=
girl.face;

document.getElementById(
"clearText"
).textContent=
girl.name+
"の持ち物を見つけたよ！";

document.getElementById(
"modal"
).classList.add("show");

}


/* --------------------------------
   次ステージ
-------------------------------- */

document
.getElementById("nextBtn")
.onclick=()=>{

document
.getElementById("modal")
.classList.remove("show");

stage++;

hearts=3;

memo.clear();

wrong.clear();

solved.clear();

initStage();

render();

startMusic();

};


/* --------------------------------
   閉じる
-------------------------------- */

document
.getElementById("closeBtn")
.onclick=()=>{

document
.getElementById("modal")
.classList.remove("show");

startMusic();

};


/* --------------------------------
   ヒント
-------------------------------- */

document
.getElementById("hintBtn")
.onclick=()=>{

ensureAudio();

tone(
1046,
.12,
.03,
"sine"
);

const remain=
targets.filter(
x=>!solved.has(x)
);

if(!remain.length)return;

const id=remain[0];

const element=
document.querySelector(
`[data-id="${id}"]`
);

if(element){

element.animate(
[
{transform:"scale(1)"},
{transform:"scale(1.12)"},
{transform:"scale(1)"}
],
{
duration:500
}
);

}

};


/* --------------------------------
   初期化
-------------------------------- */

initStage();

render();


/*
   Safariの自動再生対策。
   最初のユーザー操作後にBGM開始。
*/

document.addEventListener(
"pointerdown",
()=>{
startMusic();
},
{
once:true,
passive:true
}
);

</script>

</body>
</html>
