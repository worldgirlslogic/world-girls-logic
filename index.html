<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>WORLD GIRLS LOGIC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9fb;color:#514b55;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;touch-action:manipulation}header{padding:14px 8px 4px}.title{font-weight:800;font-size:22px}.sub{font-size:12px;color:#8d8490}.info{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:8px auto;padding:0 12px}.hearts{letter-spacing:2px}button{border:0;border-radius:18px;background:#fff;box-shadow:0 2px 8px #0002;padding:8px 13px;font-size:14px}#board{margin:8px auto 12px;width:min(92vw,520px);aspect-ratio:1;display:grid;gap:3px}.cell{position:relative;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}.mark{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,7vw,34px);font-weight:800;color:white;text-shadow:0 1px 2px #777}.red{color:#e34d59}.item{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,6vw,30px);background:#fffb}.tip{font-size:12px;line-height:1.6;color:#837b87;padding:0 14px;max-width:520px;margin:auto}#msg{min-height:22px;font-size:13px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:24px}.card{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:340px}.face{font-size:58px}
</style></head><body>
<header><div class="title">WORLD GIRLS LOGIC</div><div class="sub" id="girl"></div></header>
<div class="info"><span id="stage"></span><span id="hearts">♥♥♥</span><button id="hint">💡 ヒント</button></div>
<div id="board"></div><div id="msg">1タップ＝白✕　押したままドラッグ＝連続✕　ダブルタップ＝調べる</div>
<div class="tip">1色につき1つ・各行1つ・各列1つ・8方向に隣接させない。色のつながり方も手掛かり。</div>
<div class="modal" id="modal"><div class="card"><div class="face">😊</div><h2>見つけてくれてありがとう！</h2><p id="clear"></p><button id="next">次のステージへ</button></div></div>
<script>
const girls=["MIA 🇺🇸","SORA 🇯🇵","LUNA 🇫🇷","NINA 🇰🇷","EMMA 🇬🇧","YUNA 🇨🇳","ARIA 🇮🇹","MAYA 🇧🇷"],items=["🎀","👜","💄","🧸","👛","🧢","📱","💍","🌸","🪞"],cols=["#ead9e7","#d9e7ed","#e8dfc8","#dce8d5","#ead8cf","#d8e1ef","#e8d9df","#dbe8df","#e3d8ea","#e6e0cf"];
let S=1,N,board=[],ans=[],marks=new Set(),hearts=3,down=false,last=0,timer;
function size(){return S<=8?4:S<=16?5:S<=24?6:S<=32?7:S<=40?8:S<=48?9:10}
function rnd(x){return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function make(){
 N=size();let r=rnd(12345+S*777),p=[...Array(N).keys()];
 for(let k=0;k<200;k++){p.sort(()=>r()-.5);let ok=true;for(let i=1;i<N;i++)if(Math.abs(p[i]-p[i-1])<=1)ok=false;if(ok)break}
 ans=p.map((c,row)=>row*N+c);board=Array(N*N).fill(-1);ans.forEach((x,c)=>board[x]=c);
 let q=ans.map((x,c)=>[x,c]);
 while(q.length){let z=q.splice(Math.floor(r()*q.length),1)[0],i=z[0],c=z[1],y=Math.floor(i/N),x=i%N,ns=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{let Y=y+d[0],X=x+d[1];if(Y>=0&&Y<N&&X>=0&&X<N){let j=Y*N+X;if(board[j]<0)ns.push(j)}});if(ns.length&&r()<.72){let j=ns[Math.floor(r()*ns.length)];board[j]=c;q.push([j,c])}}
 for(let i=0;i<board.length;i++)if(board[i]<0)board[i]=i%N;
 marks.clear();hearts=3;draw()
}
function draw(){
 document.getElementById("stage").textContent="STAGE "+S+" / 80";document.getElementById("girl").textContent=girls[(S-1)%8];document.getElementById("hearts").textContent="♥".repeat(hearts)+"♡".repeat(3-hearts);
 let b=document.getElementById("board");b.innerHTML="";b.style.gridTemplateColumns=`repeat(${N},1fr)`;
 board.forEach((c,i)=>{let e=document.createElement("div");e.className="cell";e.style.background=cols[c];e.dataset.i=i;
 if(marks.has(i))e.innerHTML='<div class="mark">✕</div>';e.onpointerdown=press;e.onpointerenter=move;e.onpointerup=release;e.onpointercancel=release;b.appendChild(e)})
}
function mark(i){if(!marks.has(i)){marks.add(i);let e=document.querySelector(`[data-i="${i}"]`);if(e&&!e.querySelector(".mark"))e.insertAdjacentHTML("beforeend",'<div class="mark">✕</div>')}}
function check(i){let c=board[i];if(ans[c]===i){document.querySelector(`[data-i="${i}"]`).innerHTML='<div class="item">'+items[c]+'</div>';ans[c]=-1;if(ans.every(x=>x<0)){document.getElementById("clear").textContent=girls[(S-1)%8]+"の探し物を全部見つけました。";document.getElementById("modal").style.display="flex"}}else{hearts--;let e=document.querySelector(`[data-i="${i}"]`);e.innerHTML='<div class="mark red">✕</div>';document.getElementById("hearts").textContent="♥".repeat(hearts)+"♡".repeat(3-hearts);document.getElementById("msg").textContent="違う場所です。";if(hearts<=0)setTimeout(()=>{alert("ハートがなくなりました。もう一度挑戦しましょう。");make()},150)}}
function press(e){e.preventDefault();let i=+e.currentTarget.dataset.i;down=true;let now=Date.now();if(now-last<280){clearTimeout(timer);down=false;check(i)}else timer=setTimeout(()=>{if(down)mark(i)},280);last=now}
function move(e){if(down)mark(+e.currentTarget.dataset.i)}function release(){down=false;clearTimeout(timer)}
document.getElementById("next").onclick=()=>{document.getElementById("modal").style.display="none";S=Math.min(80,S+1);make()}
document.getElementById("hint").onclick=()=>document.getElementById("msg").textContent="ヒント：まず各色の領域を見て、1行・1列・8方向で置けないマスに✕を付けましょう。";
make();
</script></body></html>
