<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WORLD GIRLS LOGIC</title>
<style>
:root{--bg:#f7f1eb;--panel:#fffdf9;--ink:#765e59;--line:#eadfd7;
--p1:#f4c8a9;--p2:#f6dfad;--p3:#e6d37e;--p4:#c2e3be;--p5:#91c7ad;
--p6:#a0d3df;--p7:#c0b8e9;--p8:#efb8df;--p9:#dfa9ba;--p10:#c9af99;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:570px;margin:auto;padding:10px 12px 26px}
.top{height:63px;display:flex;align-items:center;justify-content:space-between}
.round{width:44px;height:44px;border:0;border-radius:50%;background:white;box-shadow:0 4px 13px #dfd0c7;color:#9d756e;font-size:29px}
.head{text-align:center}.head small{display:block;letter-spacing:.12em;font-size:12px}.head strong{font-size:25px}
.guide{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:9px 11px;margin:7px 0}
.avatar{width:48px;height:48px;border-radius:50%;background:#f0d4ca;display:grid;place-items:center;font-size:27px}
.guide b{font-size:15px}.guide span{font-size:13px}
.palette{background:white;border-radius:18px;padding:7px 8px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:9px}
.sw{height:24px;border-radius:8px;position:relative}.sw.found::after{content:attr(data-item);position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.c0{background:var(--p1)}.c1{background:var(--p2)}.c2{background:var(--p3)}.c3{background:var(--p4)}.c4{background:var(--p5)}.c5{background:var(--p6)}.c6{background:var(--p7)}.c7{background:var(--p8)}.c8{background:var(--p9)}.c9{background:var(--p10)}
.rules{background:white;border-radius:15px;padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.rule{background:#fcf4ee;border-radius:11px;min-height:58px;padding:7px 4px;text-align:center;font-size:10px;font-weight:700;line-height:1.3}
.boardShell{background:white;border-radius:19px;padding:7px;box-shadow:0 4px 15px #e3d6cd}
.board{display:grid;gap:3px}
.cell{aspect-ratio:1;border:0;border-radius:6px;position:relative;padding:0;touch-action:manipulation}
.cell:active{transform:scale(.96)}
.mark::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:27px;font-weight:800}
.wrong::after{color:#ef544b}
.item{display:none;position:absolute;inset:0;place-items:center;font-size:clamp(19px,5vw,30px);z-index:2}
.found .item{display:grid}.found::after{content:""}
.bottom{display:flex;align-items:center;justify-content:space-between;padding:12px 7px 0}
.hearts{font-size:24px;letter-spacing:1px}
.actions{display:flex;gap:9px}
.action{border:0;background:white;border-radius:18px;padding:10px 13px;box-shadow:0 4px 13px #dfd0c7;color:#765e59;font-weight:800}
.next{background:#c98f80;color:white;display:none}
.tip{text-align:center;color:#9b8982;font-size:11px;margin-top:7px;line-height:1.45}
.overlay{position:fixed;inset:0;background:#55474066;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}
.modal{background:#fffdf9;border-radius:24px;width:min(400px,100%);padding:23px;text-align:center;box-shadow:0 15px 45px #59463a55}
.girl{font-size:67px}.modal h2{margin:6px 0}.modal p{margin:6px 0 18px}
.modal button{border:0;border-radius:14px;padding:13px 22px;background:#c88e7e;color:white;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <button class="round" onclick="prevStage()">‹</button>
  <div class="head"><small>LEVEL</small><strong id="level">1</strong></div>
  <button class="round">⚙︎</button>
 </div>
 <div class="guide">
  <div class="avatar" id="avatar">🌸</div>
  <div><b id="girlName">さくら 🇯🇵</b><br><span id="goal">「私の 🔑 鍵を探して！」</span></div>
 </div>
 <div id="palette" class="palette"></div>
 <div class="rules">
  <div class="rule">1色に<br>小物は1つ</div>
  <div class="rule">行と列に<br>小物は1つずつ</div>
  <div class="rule">小物同士は<br>上下左右に隣接しない</div>
 </div>
 <div class="boardShell"><div id="board" class="board"></div></div>
 <div class="bottom">
  <div id="hearts" class="hearts">❤️❤️❤️</div>
  <div class="actions">
   <button class="action" onclick="hint()">💡 ヒント</button>
   <button id="nextBtn" class="action next" onclick="nextStage()">NEXT</button>
  </div>
 </div>
 <div class="tip" id="tip">1タップ＝白い✖️のメモ　／　ダブルタップ＝調査　／　最初は小物は見えません</div>
</div>
<div id="overlay" class="overlay">
 <div class="modal">
  <div class="girl" id="modalGirl">🌸😊</div>
  <h2 id="modalTitle">見つけた！</h2>
  <p id="modalMsg">「見つけてくれてありがとう！」</p>
  <button onclick="closeModal()">閉じる</button>
 </div>
</div>

];
const items=["🔑","👜","🪞","👛","💄","🎀","📱","🧸","💍","🕶️"];
let stageNo=Number(localStorage.getItem("wgl_stage")||1), hearts=3, found=new Set(), tapState=null;

function render(){
 const s=stages[stageNo-1], n=s.n, g=girls[(stageNo-1)%girls.length];
 document.getElementById("level").textContent=stageNo;
 document.getElementById("girlName").textContent=g[0]+" "+g[1];
 document.getElementById("avatar").textContent=g[2];
 document.getElementById("goal").textContent="「私の "+g[3]+" "+itemName(g[3])+"を探して！」";
 document.getElementById("hearts").textContent="❤️❤️❤️";
 document.getElementById("nextBtn").style.display="none";
 const pal=document.getElementById("palette"); pal.innerHTML="";
 for(let i=0;i<n;i++){ const d=document.createElement("div");d.className="sw c"+i;d.dataset.item=items[i];pal.appendChild(d); }
 const b=document.getElementById("board"); b.innerHTML=""; b.style.gridTemplateColumns=`repeat(${n},1fr)`;
 s.grid.forEach((row,r)=>row.forEach((color,c)=>{
   const el=document.createElement("button");el.className="cell c"+color;el.dataset.r=r;el.dataset.c=c;
   const t=s.targets.find(x=>x.r===r&&x.c===c);
   el.innerHTML='<span class="item">'+(t?items[t.color]:"")+'</span>';
   el.onclick=()=>tap(el,r,c);b.appendChild(el);
 }));
 found=new Set();hearts=3;tapState=null;
 document.getElementById("tip").textContent=`${n}×${n}・${n}色　1タップ＝白い✖️のメモ ／ ダブルタップ＝調査`;
}
function itemName(icon){
 return { "🔑":"鍵","👜":"バッグ","🪞":"鏡","👛":"財布","💄":"リップ","🎀":"リボン","📱":"スマホ","🧸":"ぬいぐるみ","💍":"指輪","🕶️":"サングラス" }[icon]||"探し物";
}
function tap(el,r,c){
 if(hearts<=0)return;
 const now=performance.now();
 if(tapState && now-tapState.t<430 && tapState.r===r && tapState.c===c){tapState=null;investigate(el,r,c);return;}
 tapState={r,c,t:now};
 setTimeout(()=>{
   if(tapState && tapState.r===r && tapState.c===c){el.classList.add("mark");tapState=null;}
 },455);
}
function investigate(el,r,c){
 const s=stages[stageNo-1], t=s.targets.find(x=>x.r===r&&x.c===c);
 if(t){
   if(found.has(t.color))return;
   found.add(t.color);el.classList.add("found");
   document.getElementById("palette").children[t.color].classList.add("found");
   if(found.size===s.n){
     localStorage.setItem("wgl_stage",String(Math.min(80,stageNo+1)));
     setTimeout(clearStage,250);
   }
 }else{
   hearts--;document.getElementById("hearts").textContent="❤️".repeat(hearts)+"♡".repeat(3-hearts);
   el.classList.add("mark","wrong");
   if(hearts===0)setTimeout(gameOver,250);
 }
}
function clearStage(){
 document.getElementById("modalGirl").textContent=girls[(stageNo-1)%girls.length][2]+"😊";
 document.getElementById("modalTitle").textContent="STAGE CLEAR";
 document.getElementById("modalMsg").textContent="「見つけてくれてありがとう！」";
 document.querySelector(".modal button").textContent=stageNo<80?"次へ":"最終ステージクリア！";
 document.querySelector(".modal button").onclick=stageNo<80?nextStage:closeModal;
 document.getElementById("overlay").style.display="flex";
}
function gameOver(){
 document.getElementById("modalGirl").textContent=girls[(stageNo-1)%girls.length][2];
 document.getElementById("modalTitle").textContent="GAME OVER";
 document.getElementById("modalMsg").textContent="❤️がなくなりました。もう一度挑戦しよう！";
 document.querySelector(".modal button").textContent="リトライ";
 document.querySelector(".modal button").onclick=()=>{closeModal();render();};
 document.getElementById("overlay").style.display="flex";
}
function closeModal(){document.getElementById("overlay").style.display="none";}
function nextStage(){
 closeModal();
 if(stageNo<80){stageNo++;localStorage.setItem("wgl_stage",String(stageNo));render();}
}
function prevStage(){
 if(stageNo>1){stageNo--;localStorage.setItem("wgl_stage",String(stageNo));render();}
}
function hint(){
 const n=stages[stageNo-1].n;
 if(stageNo<17){alert("序盤はヒントなし。色のつながりと3つのルールを使って考えてみよう！");return;}
 alert("ヒント（本番では広告視聴後に表示する想定）\n\nこのステージは "+n+"×"+n+"。\nまず白い✖️で「この色の小物を置けない場所」を消して、行・列・隣接の条件を重ねて考えてみよう。");
}
render();
</script>
</body>
</html>
