<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORLD GIRLS LOGIC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#2d2630;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px 14px 36px}.title{text-align:center;font-size:28px;font-weight:900;margin:4px 0 2px}.sub{text-align:center;color:#777;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:16px;padding:10px 14px;box-shadow:0 3px 12px #00000012;margin-bottom:12px}
button{font:inherit;border:0;cursor:pointer}.small{padding:8px 11px;border-radius:10px;background:#eee}
.rules{background:#fff;border-radius:16px;padding:13px;margin-bottom:12px;font-size:14px;line-height:1.6}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 14px}.girl{background:white;border:2px solid #eee;border-radius:13px;padding:8px 3px;font-size:12px}.girl.on{border-color:#d66aa2;background:#fff0f7}.flag{font-size:23px;display:block}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:390px;margin:0 auto 14px}
.cell{aspect-ratio:1;background:white;border:2px solid #e5dfe4;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;touch-action:manipulation}
.cell.fixed{background:#f2edf1}.cell.sel{background:#ffe2f0;border-color:#d66aa2}.cell.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
.actions{display:flex;gap:8px}.actions button{flex:1;padding:13px;border-radius:13px;font-weight:800}.check{background:#d65d99;color:white}.reset{background:#eee}
.msg{text-align:center;min-height:28px;font-weight:700;margin:9px}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stage{padding:9px 2px;border-radius:10px;background:#eee}.stage.active{background:#d65d99;color:white}
</style>
</head>
<body>
<div class="wrap">
<div class="title">WORLD GIRLS LOGIC</div>
<div class="sub">かわいい女の子で遊ぶオリジナル論理パズル</div>
<div class="top"><b id="stageLabel">STAGE 1 / 20</b><span>❤️❤️❤️</span></div>
<div class="rules"><b>ルール</b><br>① 1行に同じ女の子は1人まで<br>② 1列に同じ女の子は1人まで<br>③ 同じ女の子を上下左右に隣り合わせない<br>④ ピンクのマスは固定です</div>
<div class="pick" id="pick"></div>
<div class="board" id="board"></div>
<div class="actions"><button class="reset" onclick="resetBoard()">リセット</button><button class="check" onclick="check()">答え合わせ</button></div>
<div class="msg" id="msg"></div>
<div class="stages" id="stages"></div>
</div>
<script>
const girls=[
["🇯🇵","さくら"],["🇫🇷","エマ"],["🇰🇷","ジス"],["🇮🇹","ソフィア"],
["🇧🇷","ルナ"],["🇮🇳","アリヤ"],["🇸🇪","リリ"],["🇺🇸","レイチェル"]
];
let stage=1, selected=0, grid=[], fixed=[];
const solutions=[
[0,1,2,3],[1,2,3,0],[2,3,0,1],[3,0,1,2]
];
function init(){
 document.getElementById("pick").innerHTML=girls.map((g,i)=>`<button class="girl ${i===0?"on":""}" onclick="selectGirl(${i})"><span class="flag">${g[0]}</span>${g[1]}</button>`).join("");
 document.getElementById("stages").innerHTML=Array.from({length:20},(_,i)=>`<button class="stage ${i===0?"active":""}" onclick="loadStage(${i+1})">${i+1}</button>`).join("");
 loadStage(1);
}
function selectGirl(i){selected=i;document.querySelectorAll(".girl").forEach((b,j)=>b.classList.toggle("on",j===i))}
function loadStage(n){
 stage=n;grid=Array(16).fill(null);fixed=Array(16).fill(false);
 const s=solutions[(n-1)%4];
 // fixed clues vary by stage
 const clues=[0,5,10,15].map((x,k)=>(x+(n-1)%3)%16);
 clues.forEach((p,k)=>{fixed[p]=true;grid[p]=s[p%4]});
 document.getElementById("stageLabel").textContent=`STAGE ${stage} / 20`;
 document.querySelectorAll(".stage").forEach((b,i)=>b.classList.toggle("active",i===stage-1));
 document.getElementById("msg").textContent="";
 render();
}
function render(){
 document.getElementById("board").innerHTML=grid.map((v,i)=>{
  const text=v==null?"":girls[v][0];
  return `<button class="cell ${fixed[i]?"fixed":""}" onclick="tap(${i})">${text}</button>`;
 }).join("");
}
function tap(i){if(fixed[i])return;grid[i]=selected;render()}
function resetBoard(){loadStage(stage)}
function check(){
 const s=solutions[(stage-1)%4];
 let ok=true;
 for(let i=0;i<16;i++) if(!fixed[i] && grid[i]!==s[i%4]) ok=false;
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const v=grid[r*4+c]; if(v==null){ok=false;continue}
  for(let k=0;k<4;k++){if(k!==c&&grid[r*4+k]===v)ok=false;if(k!==r&&grid[k*4+c]===v)ok=false}
  if(r<3&&grid[(r+1)*4+c]===v)ok=false;if(c<3&&grid[r*4+c+1]===v)ok=false;
 }
 const m=document.getElementById("msg");
 if(ok){m.textContent="🎉 CLEAR！ステージクリア！";}else{m.textContent="もう一度確認してみよう！"}
}
init();
</script>
</body>
</html>
